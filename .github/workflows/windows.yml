name: Windows application

on:
  push:
    paths:
      - "apps/windows/**"
      - "apps/shared/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "apps/shared/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/windows.yml"

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:desktop
      - run: npm run test:platform-onboarding
      - run: npm run test:windows-office-architecture
      - run: npm run test:runtime-ownership
      - run: npm run build:office:windows-native
      - run: python -m pip install "Pillow>=10.4,<12" "numpy>=1.26,<3"
      - run: python -m unittest ocr.tests.test_worker_preprocess
      # A checkout has none of the native inputs a release stages (npm run build:bundle): the
      # installers, the input method, the MCP launcher. Tauri's build script only needs them
      # to exist, so the checks below get empty test-only stand-ins.
      - name: Prepare Tauri test-only bundle inputs
        shell: pwsh
        run: |
          $resourceDir = "src-tauri/resources/windows-office"
          New-Item -ItemType Directory -Force $resourceDir | Out-Null
          foreach ($name in @("VisualTeX-WindowsOffice-VSTO-x64.msi", "VisualTeX-WindowsOffice-VSTO-x86.msi", "VisualTeX-NativeRender-x64.msi")) {
            $path = Join-Path $resourceDir $name
            if (-not (Test-Path $path)) { New-Item -ItemType File $path | Out-Null }
            $metadata = @{
              fileName = $name
              sha256 = ""
              size = 0
              testOnly = $true
            } | ConvertTo-Json -Compress
            Set-Content -NoNewline -Path (Join-Path $resourceDir "$([IO.Path]::GetFileNameWithoutExtension($name)).sha256.json") -Value $metadata
          }
          New-Item -ItemType Directory -Force "input-method/build/VisualTeX Input" | Out-Null
          New-Item -ItemType File -Force "input-method/build/VisualTeX Input/test-only.txt" | Out-Null
          New-Item -ItemType Directory -Force "src-tauri/binaries" | Out-Null
          New-Item -ItemType File -Force "src-tauri/binaries/visualtex-mcp-x86_64-pc-windows-msvc.exe" | Out-Null
      # The Windows Tauri test executable is known to exit in the loader before
      # the Rust harness starts (STATUS_ENTRYPOINT_NOT_FOUND). Keep both source
      # checking and full test-binary linking as explicit gates without claiming
      # that the Rust unit tests ran on this runner.
      - name: Check Windows Rust tests
        run: cargo check --manifest-path src-tauri/Cargo.toml --tests
      - run: npm run test:windows-resource-ownership
      - name: Compile Windows Rust test binary
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run
