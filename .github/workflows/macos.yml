name: macOS application

on:
  push:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/macos.yml"

jobs:
  build-and-test:
    # GitHub retires pinned macOS images (macos-14 is no longer offered: the job never started)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/macos/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-office-build.txt
      - run: npm ci
      - run: npm run build:desktop
      # A checkout has no input method build (scripts/build_macos_input_method.mjs): the Office
      # artifact smoke and Tauri's build script only need it to exist, so they get a test-only stand-in.
      - name: Prepare Tauri test-only bundle inputs
        run: |
          mkdir -p "input-method/build/VisualTeX Formula.app/Contents"
          touch "input-method/build/VisualTeX Formula.app/Contents/test-only.txt"
      - run: npm run test:word-omml
      - run: npm run test:platform-onboarding
      - run: npm run test:editor-lifecycle
      - run: npm run test:macos-offline-office
      - run: mkdir -p dist-ocr/macos-arm64
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
