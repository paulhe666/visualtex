[workspace]
members = ["crates/core", "crates/wasm", "crates/test-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.105"
unicode-segmentation = "=1.12.0"
ttf-parser = "=0.25.1"
rustybuzz = "=0.20.1"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
