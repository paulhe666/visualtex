[package]
name = "visualtex-mcp"
version = "1.3.1"
description = "VisualTeX MCP server for AI agents (stdio launcher for the Office companion)"
edition = "2021"
publish = false

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde_json = "1"
sha1 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
