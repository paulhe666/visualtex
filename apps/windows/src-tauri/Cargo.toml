[package]
name = "visualtex"
version = "1.2.5"
description = "A visual LaTeX formula editor"
authors = ["paulhe666"]
license = "MIT"
edition = "2021"
default-run = "visualtex"

[features]
ocr-install-acceptance = []
ocr-python-bundle-acceptance = []
ocr-model-acceptance = []
ocr-storage-acceptance = []

[[bin]]
name = "ocr_install_acceptance"
path = "src/bin/ocr_install_acceptance.rs"
required-features = ["ocr-install-acceptance"]

[[bin]]
name = "ocr_python_bundle_acceptance"
path = "src/bin/ocr_python_bundle_acceptance.rs"
required-features = ["ocr-python-bundle-acceptance"]

[[bin]]
name = "ocr_model_acceptance"
path = "src/bin/ocr_model_acceptance.rs"
required-features = ["ocr-model-acceptance"]

[[bin]]
name = "ocr_storage_acceptance"
path = "src/bin/ocr_storage_acceptance.rs"
required-features = ["ocr-storage-acceptance"]

[lib]
name = "visualtex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
tauri-plugin-opener = "2.5.4"
axum = { version = "0.8.9", features = ["json", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["fs", "limit", "set-header"] }
time = "0.3"
getrandom = "0.3"
hex = "0.4"
flate2 = "1.1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "windows")'.dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "aws_lc_rs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
ttf-parser = "0.25"

[target.'cfg(not(target_os = "windows"))'.dependencies]
rcgen = "0.14.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSRunningApplication", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[dev-dependencies]
tempfile = "3"
x509-parser = "0.18.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
