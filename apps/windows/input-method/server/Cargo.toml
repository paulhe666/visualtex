[package]
name = "visualtex-input-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VisualTeX Input: RIME pinyin and the candidate window for VisualTeX's Windows input method"

[[bin]]
name = "VisualTeXInput"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
windows-core.workspace = true

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]
