# VisualTeX input method: RIME defaults.
# Adapted from rime-prelude default.yaml (LGPL-3.0, RIME developers): one
# schema (VisualTeX pinyin), nine candidates, Shift switches between Chinese
# and English and types what was spelled, as macOS Pinyin does.
# encoding: utf-8

config_version: '0.50.visualtex.1'

schema_list:
  - schema: visualtex_pinyin

switcher:
  caption: 〔方案選單〕
  hotkeys: []
  save_options:
    - full_shape
    - ascii_punct
    - zh_hans
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 9

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_brackets

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
