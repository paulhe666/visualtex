[package]
name = "visualtex-ibus"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "VisualTeX's Linux input method (an IBus engine): pinyin, English and formulas in any application"

[[bin]]
name = "visualtex-ibus"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# a key pressed for fields that report their cursor only at key events (Chromium, Electron): X11
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
