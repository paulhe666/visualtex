# VisualTeX input method: pinyin in Simplified Chinese.
# Dictionary and spelling rules from 万象拼音 (wanxiang, amzxyz/rime_wanxiang
# v18.1.10, CC-BY-4.0): its base dictionary (visualtex_wanxiang.dict.yaml
# imports its tables unchanged) and its full-pinyin spelling algebra
# (wanxiang_algebra.yaml, base/全拼), without its Lua scripts and grammar
# model. Changes: VisualTeX's own schema around them (switches, processors,
# punctuation from rime-prelude), no stroke or reverse lookup, no tones typed
# as digits (digits choose candidates).
# encoding: utf-8

schema:
  schema_id: visualtex_pinyin
  name: VisualTeX 拼音
  version: '2'
  author:
    - 万象拼音 amzxyz (dictionary, spelling rules; CC-BY-4.0)
  description: |
    万象拼音的词库与拼写规则，简化字输出。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - wanxiang_algebra:/base/全拼

translator:
  dictionary: visualtex_wanxiang
  prism: visualtex_pinyin
  enable_user_dict: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
